name: Offline verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.11 / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [core, studio]
    env:
      TRIALTRUST_ENABLE_LIVE: '0'
      TRIALTRUST_RUNTIME: runtime/ci/web
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements.lock
      - name: Install managed Studio dependencies
        if: matrix.profile == 'studio'
        run: python -m pip install -r requirements.txt
      - name: Check frozen evidence
        run: python tools/verify_evidence.py
      - name: Run offline regression and MCP protocol checks
        run: python -m pytest -q
      - name: Verify trusted portal layout messages
        run: node --test tests/portal_viewport.test.cjs tests/workbench_tools.test.cjs
      - name: Reproduce sparse development evaluation
        run: python -m trialtrust.evaluate --output runtime/ci-evaluation.json
